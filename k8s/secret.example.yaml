# Plantilla del Secret de SIPScan.
# Copiar a k8s/secret.yaml (ignorado por git) y rellenar con valores reales:
#   cp k8s/secret.example.yaml k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: sipscan-secret
  namespace: sipscan
type: Opaque
stringData:
  # Base de datos
  POSTGRES_DB: "sipscan"
  POSTGRES_USER: "sipscan_user"
  POSTGRES_PASSWORD: "CHANGEME-postgres-password"
  DATABASE_URL: "postgresql+asyncpg://sipscan_user:CHANGEME-postgres-password@postgres:5432/sipscan"

  # JWT
  AUTH_SECRET: "CHANGEME-auth-secret"

  # Google Gemini
  GEMINI_API_KEY: "CHANGEME-gemini-api-key"
  GEMINI_MODEL: "gemini-2.5-flash"

  # AWS (S3 + Textract) — crear un IAM user con la policy en iam/sipscan-policy.json
  AWS_ACCESS_KEY_ID: "CHANGEME-aws-access-key-id"
  AWS_SECRET_ACCESS_KEY: "CHANGEME-aws-secret-access-key"

  # S3
  AWS_REGION: "us-east-2"
  S3_BUCKET: "sipscan-dev-uploads"
  S3_PREFIX: "receipts"
  PRESIGN_TTL_SECONDS: "604800"

  # ERP (servicios internos)
  ERP_DOCUMENTOS_HOST: "https://sipsoftware.co/erp/documentos"
  ERP_TERCEROS_HOST: "https://sipsoftware.co/erp/terceros"
