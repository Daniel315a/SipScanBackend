# Reemplaza PROJECT_ID con tu GCP Project ID
# Reemplaza IMAGE_TAG con el tag de la imagen (ej: latest, git sha)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sipscan-api
  namespace: sipscan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sipscan-api
  template:
    metadata:
      labels:
        app: sipscan-api
    spec:
      serviceAccountName: sipscan-api
      initContainers:
        # Espera a que PostgreSQL esté listo antes de arrancar la API
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Esperando a PostgreSQL...";
                sleep 2;
              done
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/sipscanback/sipscan/sipscan:e6d70c4
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sipscan-config
            - secretRef:
                name: sipscan-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
